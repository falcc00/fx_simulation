<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pit Wall – F1 Manager Sim</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0c0f;--s:#14161b;--s2:#1b1e25;--b:#262a33;--t:#e8eaf0;--m:#8a90a0;--a:#e10600;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px 'Space Grotesk',system-ui,sans-serif}
#app{max-width:920px;margin:0 auto;padding:16px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px}
.card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:12px}
h1,h2,h3{margin:0 0 10px}h1{font-size:26px}h2{font-size:18px}h3{font-size:13px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}
.m{color:var(--m)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
button{font:inherit;color:var(--t);background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--m)}button.p{background:var(--a);border-color:var(--a);color:#fff;font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}button.on{border-color:var(--a);background:#2a1618}button.s{padding:5px 9px;font-size:12px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--b);white-space:nowrap}
th{color:var(--m);font-weight:500;font-size:12px}tr.me td{background:#ffffff0d}
.bar{height:4px;background:var(--s2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
.dot{display:inline-block;width:4px;height:14px;border-radius:2px;vertical-align:middle;margin-right:8px}
.steps{display:flex;gap:6px;margin:10px 0}.st{flex:1;text-align:center;padding:8px 2px;border-radius:8px;background:var(--s2);color:var(--m);font-size:12px}
.st.d{color:#4ade80}.st.c{background:var(--a);color:#fff;font-weight:700}
.wrap{overflow-x:auto}.up{color:#4ade80}.dn{color:#f87171}
.stt{display:inline-flex;gap:8px;color:var(--m)}.stt b{color:var(--t);font-weight:600}
.tb{display:inline-block;width:20px;height:20px;line-height:17px;text-align:center;border:2px solid;border-radius:50%;font:700 11px 'JetBrains Mono',monospace;margin-right:6px}
.mod{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}.mod .card{max-width:380px;width:100%}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:10px;display:none;z-index:9}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const KEY='pitwall_save',SETUP='pitwall_setup',PTS=[25,18,15,12,10,8,6,4,2,1],STEPS=['FP1','FP2','FP3','Quali','Race'];
const TY={S:{l:20,p:-.55,c:'#ef4444'},M:{l:30,p:-.2,c:'#facc15'},H:{l:42,p:0,c:'#e5e7eb'},I:{l:30,p:0,c:'#22c55e'},W:{l:26,p:0,c:'#3b82f6'}};
const MM={dry:{S:0,M:0,H:0,I:4,W:6},inter:{S:7,M:7,H:7,I:0,W:1.5},wet:{S:10,M:10,H:10,I:2.5,W:0}},SL={dry:0,inter:.06,wet:.1},WX={dry:'Dry',inter:'Intermediate',wet:'Wet'};
const ic=(p)=>`<svg class="i" viewBox="0 0 24 24"><path d="${p}"/></svg>`;
const I={play:ic('M6 4l14 8-14 8z'),skip:ic('M5 4l10 8-10 8zM19 5v14'),zap:ic('M13 2 4 14h7l-1 8 9-12h-7z')};
const DF=[.5,.6,.7,.4,.3,.4,.4,1,.7,.4,.6,.4,.9,.8,0,.6,.3,.95,.5,.6,.6,.1,.7,.5],KIND=['FP','FP','FP','Q','R'];
const PARTS=[{id:'fw',n:'Front Wing',e:{aero:2.5}},{id:'rw',n:'Rear Wing',e:{aero:1.5,spd:1}},{id:'fl',n:'Floor',e:{aero:3}},{id:'sp',n:'Sidepods & Cooling',e:{spd:1.5,rel:1}},{id:'su',n:'Suspension',e:{mech:2.5,care:1.5}},{id:'br',n:'Brakes',e:{mech:1.5,rel:1}},{id:'gb',n:'Gearbox',e:{spd:1.5,rel:1.5}},{id:'wr',n:'Weight Reduction',e:{mech:1.2,spd:1.2}}];
const SN={aero:'Downforce',spd:'Top speed',mech:'Mechanical',care:'Tyre care',rel:'Reliability'};
let D,G,V='hub',TAB='race',S=null,TM=null,TR=null;
const lerp=(v,[a,b],[c,d])=>Math.round(c+(clamp(v,a,b)-a)/(b-a)*(d-c));
const dcost=d=>lerp(d.r,D.meta[d.s].ovr,D.meta[d.s].cost),price=d=>Math.round(dcost(d)*1.5);
const ecost=e=>Math.round(lerp((e.att+e.def+e.tyr)/3,D.meta.eng.avg,D.meta.eng.cost)*1.5);
const save=()=>localStorage.setItem(KEY,JSON.stringify(G));
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const C=()=>D.circuits[Math.min(G.round,23)],tc=t=>G.teams[t].c,sh=d=>d.n.replace(/^(\S)\S*\s/,'$1. ');
const myIds=()=>Object.values(G.drv).filter(d=>d.t=='P').map(d=>d.id);
const engOf=d=>d.t=='P'?Object.values(G.eng).find(e=>e.own&&e.dv==d.id):null;
const eff=(d,k)=>{if(d.t!='P')return d[k];const e=engOf(d);return d[k]*.65+(e?e[k]:55)*.35};
const chassis=()=>{const c=G.car,df=DF[Math.min(G.round,23)];return (c.aero*df+c.spd*(1-df))*.65+c.mech*.35};
const carEff=d=>d.t=='P'?chassis()*.6+G.pu.pw*.4:G.teams[d.t].car;
const base=d=>C()[2]-(carEff(d)*.6+d.r*.4-80)*.12-(d.cor-75)*.012;
const ft=s=>Math.floor(s/60)+':'+(s%60).toFixed(3).padStart(6,'0');
const stats=d=>`<span class="mono stt">ATT <b>${d.att}</b> DEF <b>${d.def}</b> TYR <b>${d.tyr}</b> COR <b>${d.cor}</b></span>`;
const estats=e=>`<span class="mono stt">ATT <b>${e.att}</b> DEF <b>${e.def}</b> TYR <b>${e.tyr}</b></span>`;
function build(su){
 G={season:2026,round:0,money:40,news:[],dp:{},tp:{},teams:{},drv:{},eng:{},wk:null,name:su.name,color:su.color,car:{aero:62,spd:62,mech:62,care:60,rel:0},parts:{},rd:[],wt:0,pu:{n:D.pu[su.pu][1],pw:D.pu[su.pu][2],rel:D.pu[su.pu][3],eff:D.pu[su.pu][4]}};
 D.teams.forEach(t=>G.teams[t[0]]={n:t[1],c:t[2],car:t[3]});G.teams.P={n:su.name,c:su.color};
 D.drivers.forEach((d,i)=>G.drv[i]={id:i,n:d[0],s:d[1],r:d[2],att:d[3],def:d[4],tyr:d[5],cor:d[6],t:d[7]||'FA'});
 su.drv.forEach(i=>G.drv[i].t='P');
 D.engineers.forEach((e,i)=>G.eng[i]={id:i,n:e[0],att:e[1],def:e[2],tyr:e[3],own:false,dv:null});
 for(const k in su.eng)if(su.eng[k]!=null){G.eng[su.eng[k]].own=true;G.eng[su.eng[k]].dv=+k}
 fill();wk();save();
}
function fill(){D.teams.forEach(t=>{let n=Object.values(G.drv).filter(d=>d.t==t[0]).length;while(n++<2){const p=Object.values(G.drv).filter(d=>d.t=='FA').sort((a,b)=>b.r-a.r).slice(0,8);p[Math.floor(Math.random()*p.length)].t=t[0]}})}
function wk(){const w=Math.random();G.wk={step:0,grid:null,wx:w<.08?'wet':w<.2?'inter':'dry'}}
function head(){return `<div class="row card" style="padding:12px"><b style="color:var(--a)">${G.name}</b><span class="m">Season ${G.season}</span><span class="sp"></span><span class="mono">$${G.money.toFixed(1)}M</span><button class="s" onclick="if(confirm('Delete save and start over?')){localStorage.removeItem(KEY);localStorage.removeItem(SETUP);location.href='index.html'}">New game</button></div>`}
function render(){
 if(V=='hub')hub();else if(V=='res')resView();else if(V=='end')endView();
 else{$('#app').innerHTML=`${head()}<div class="card"><div class="row"><h2 id="stt" class="sp"></h2><span id="tmr" class="mono"></span></div><div class="bar"><i id="pg" style="width:0"></i></div><div id="ctl" style="margin-top:12px"></div></div><div class="card wrap" style="max-height:560px;overflow-y:auto" id="tbl"></div>`;ctl();draw()}
}
function hub(){
 save();const w=G.wk,c=C(),tabs=[['race','Race'],['std','Standings'],['mkt','Drivers'],['eng','Engineers'],['car','Car & PU']];
 let h=head()+`<div class="tabs">${tabs.map(t=>`<button class="${TAB==t[0]?'on':''}" onclick="TAB='${t[0]}';hub()">${t[1]}</button>`).join('')}</div>`;
 if(TAB=='race'){
  h+=`<div class="card"><h3>Round ${G.round+1} / 24</h3><h1>${c[0]} GP</h1><div class="m">${c[1]} laps · ref. lap ${ft(c[2])} · Weather: <b style="color:var(--t)">${WX[w.wx]}</b></div>
  <div class="steps">${STEPS.map((s,i)=>`<div class="st ${i<w.step?'d':i==w.step?'c':''}">${s}</div>`).join('')}</div>
  <div class="row"><button class="p" onclick="startS('${KIND[w.step]}')">${I.play} Start ${STEPS[w.step]}</button>${w.step<4?`<button onclick="startS('${KIND[w.step]}',true)">${I.zap} Auto-run to Quali</button>`:''}</div></div>
  <div class="card"><h3>Your drivers</h3>${myIds().map(i=>{const d=G.drv[i],e=engOf(d);return `<div style="margin-bottom:10px"><div class="row"><span class="dot" style="background:${G.color}"></span><b>${d.n}</b><span class="m">${d.s}</span><span class="sp"></span><span class="mono">OVR ${d.r} · ${G.dp[i]||0} pts</span></div>${stats(d)}<div class="m">Engineer: ${e?e.n:'none (hire one in Engineers)'}</div></div>`}).join('')}</div>`;
  if(G.news.length)h+=`<div class="card"><h3>News</h3>${G.news.map(n=>`<div class="m">${n}</div>`).join('')}</div>`;
 }
 if(TAB=='std'){
  const ds=Object.keys(G.dp).map(Number).sort((a,b)=>G.dp[b]-G.dp[a]),ts=Object.keys(G.teams).sort((a,b)=>(G.tp[b]||0)-(G.tp[a]||0));
  h+=`<div class="card"><h3>Drivers</h3><table>${ds.length?ds.map((i,k)=>`<tr class="${G.drv[i].t=='P'?'me':''}"><td class="mono">${k+1}</td><td><span class="dot" style="background:${tc(G.drv[i].t)}"></span>${G.drv[i].n}</td><td class="mono">${G.dp[i]}</td></tr>`).join(''):'<tr><td class="m">No points yet</td></tr>'}</table></div>
  <div class="card"><h3>Constructors</h3><table>${ts.map((t,k)=>`<tr class="${t=='P'?'me':''}"><td class="mono">${k+1}</td><td><span class="dot" style="background:${tc(t)}"></span>${G.teams[t].n}</td><td class="mono">${G.tp[t]||0}</td></tr>`).join('')}</table></div>`;
 }
 if(TAB=='mkt'){
  const L=Object.values(G.drv).filter(d=>d.t!='P').sort((a,b)=>b.r-a.r);
  h+=`<div class="card wrap"><h3>Recruit / trade drivers</h3><table><tr><th>Driver</th><th>Ser.</th><th>Team</th><th>OVR</th><th>ATT</th><th>DEF</th><th>TYR</th><th>COR</th><th>Price</th><th></th></tr>${L.map(d=>`<tr><td><span class="dot" style="background:${d.t=='FA'?'#555':tc(d.t)}"></span>${d.n}</td><td class="m">${d.s}</td><td class="m">${d.t=='FA'?'Free agent':G.teams[d.t].n}</td><td class="mono">${d.r}</td><td class="mono">${d.att}</td><td class="mono">${d.def}</td><td class="mono">${d.tyr}</td><td class="mono">${d.cor}</td><td class="mono">$${price(d)}M</td><td><button class="s" onclick="TR=${d.id};hub()">Recruit</button></td></tr>`).join('')}</table></div>`;
  if(TR!=null){const t=G.drv[TR];h+=`<div class="mod"><div class="card"><h2>Recruit ${t.n}</h2><p class="m">Pick which driver to replace. You get 50% of his value back; he moves to ${t.t=='FA'?'the free agent pool':G.teams[t.t].n}.</p>${myIds().map(i=>{const d=G.drv[i];return `<button style="width:100%;margin-bottom:8px" onclick="trade(${TR},${i})">Replace ${d.n} · cost $${price(t)-Math.round(price(d)/2)}M</button>`}).join('')}<button onclick="TR=null;hub()">Cancel</button></div></div>`}
 }
 if(TAB=='eng'){
  const E=Object.values(G.eng),mine=E.filter(e=>e.own),mk=E.filter(e=>!e.own).sort((a,b)=>ecost(b)-ecost(a));
  h+=`<div class="card"><h3>Your engineers (${mine.length}/2)</h3>${mine.length?mine.map(e=>`<div style="margin-bottom:12px"><div class="row"><b>${e.n}</b>${estats(e)}</div><div class="row" style="margin-top:6px"><span class="m">Assigned: ${e.dv!=null?G.drv[e.dv].n:'—'}</span>${myIds().map(i=>`<button class="s ${e.dv==i?'on':''}" onclick="assign(${e.id},${i})">${sh(G.drv[i])}</button>`).join('')}<button class="s" onclick="G.eng[${e.id}].own=false;G.eng[${e.id}].dv=null;hub()">Release</button></div></div>`).join(''):'<div class="m">No engineers hired. Drivers without one get a weak default (55).</div>'}</div>
  <div class="card wrap"><h3>Engineer market</h3><table>${mk.map(e=>`<tr><td>${e.n}</td><td>${estats(e)}</td><td class="mono">$${ecost(e)}M</td><td><button class="s" onclick="hire(${e.id})">Hire</button></td></tr>`).join('')}</table></div>`;
 }
 if(TAB=='car')h+=carTab();
 $('#app').innerHTML=h;
}
const pcost=(p,l)=>Math.round(5+l*3+Object.values(p.e).reduce((a,b)=>a+b,0)*2),pch=l=>clamp(.65+G.wt*.05-l*.04,.3,.95);
function carTab(){
 const c=G.car,df=DF[Math.min(G.round,23)],bar=(n,v)=>`<div class="row" style="margin:4px 0"><span style="width:110px" class="m">${n}</span><div class="bar sp"><i style="width:${clamp(v,0,100)}%"></i></div><span class="mono">${v.toFixed(1)}</span></div>`;
 let h=`<div class="card"><h3>Car · ${C()[0]} GP</h3><div class="m" style="margin-bottom:8px">Circuit is ${Math.round(df*100)}% downforce-dependent · effective chassis <b style="color:var(--t)">${chassis().toFixed(1)}</b></div>${bar('Downforce',c.aero)}${bar('Top speed',c.spd)}${bar('Mechanical',c.mech)}${bar('Tyre care',c.care)}${bar('Reliability',G.pu.rel+c.rel)}</div>
 <div class="card"><h3>Power unit</h3><b>${G.pu.n}</b><div class="mono m" style="margin-top:6px">POWER ${G.pu.pw} · RELIABILITY ${G.pu.rel} · EFFICIENCY ${G.pu.eff}</div></div>
 <div class="card"><div class="row"><h3 style="margin:0">Wind tunnel & CFD</h3><span class="sp"></span><span class="mono">Lv ${G.wt}/5</span></div><p class="m">Raises R&D success chance by 5% per level.</p><button ${G.wt>=5?'disabled':''} onclick="facUp()">Upgrade · $${12+G.wt*8}M</button></div>
 <div class="card wrap"><h3>R&D projects (${G.rd.length}/2 active)</h3>${G.rd.map(r=>`<div class="row" style="margin-bottom:6px"><b>${PARTS.find(p=>p.id==r.id).n}</b><span class="m">${r.left} race(s) left</span></div>`).join('')}
 <table><tr><th>Part</th><th>Level</th><th>Effect</th><th>Success</th><th>Time</th><th>Cost</th><th></th></tr>${PARTS.map(p=>{const l=G.parts[p.id]||0,act=G.rd.some(r=>r.id==p.id),cost=pcost(p,l);return `<tr><td>${p.n}</td><td class="mono">${l}/6</td><td class="m">${Object.entries(p.e).map(([k,v])=>`+${v} ${SN[k]}`).join(', ')}</td><td class="mono">${Math.round(pch(l)*100)}%</td><td class="mono">${l>=3?3:2} races</td><td class="mono">$${cost}M</td><td><button class="s" ${act||l>=6||G.rd.length>=2?'disabled':''} onclick="startRD('${p.id}')">${act?'In progress':'Develop'}</button></td></tr>`}).join('')}</table></div>`;
 return h}
function facUp(){const c=12+G.wt*8;if(c>G.money)return toast('Not enough budget');G.money-=c;G.wt++;hub()}
function startRD(id){const p=PARTS.find(x=>x.id==id),l=G.parts[id]||0,c=pcost(p,l);if(G.rd.length>=2)return toast('Max 2 projects');if(c>G.money)return toast('Not enough budget');G.money-=c;G.rd.push({id,left:l>=3?3:2});hub()}
const applyP=(p,k)=>{for(const x in p.e)G.car[x]+=p.e[x]*k}
function rdTick(){const out=[];G.rd=G.rd.filter(r=>{if(--r.left>0)return true;const p=PARTS.find(x=>x.id==r.id),l=G.parts[r.id]||0,ch=pch(l),x=Math.random(),dm=1-l*.08;
 if(x<ch){applyP(p,dm);G.parts[p.id]=l+1;out.push(`R&D: ${p.n} Lv${l+1} — success`)}
 else if(x<ch+.15){applyP(p,dm*.5);G.parts[p.id]=l+1;out.push(`R&D: ${p.n} Lv${l+1} — partial gain`)}
 else out.push(`R&D: ${p.n} — failed, no correlation with wind tunnel data`);return false});return out}
function hire(id){const e=G.eng[id];if(Object.values(G.eng).filter(x=>x.own).length>=2)return toast('Max 2 engineers');if(ecost(e)>G.money)return toast('Not enough budget');G.money-=ecost(e);e.own=true;hub()}
function assign(id,dv){Object.values(G.eng).forEach(x=>{if(x.dv==dv)x.dv=null});G.eng[id].dv=dv;hub()}
function trade(t,m){const a=G.drv[t],b=G.drv[m],c=price(a)-Math.round(price(b)/2);if(c>G.money){TR=null;hub();return toast('Not enough budget')}
 G.money-=c;Object.values(G.eng).forEach(x=>{if(x.dv==m)x.dv=null});b.t=a.t;a.t='P';TR=null;toast(a.n+' joined your team!');hub()}
function startS(k,chain){
 const L=Object.values(G.drv).filter(d=>d.t!='FA').map(d=>d.id);
 S={k,ids:L,tick:0,best:{},push:3,boost:0,seg:0,elim:[[],[]],act:L.slice(),lap:0,sc:0,chain:!!chain,done:false,N:k=='R'?C()[1]:k=='Q'?150:50};
 if(k=='R'){const wx=G.wk.wx;S.cars=G.wk.grid.map((id,p)=>{const ty=wx=='wet'?'W':wx=='inter'?'I':['S','M','M','H','H'][Math.floor(Math.random()*5)];return{id,t:p*.3,w:0,pits:0,tyre:ty,used:[ty],dnf:false,form:rnd(-.4,.4),th:rnd(0,.1)}})}
 V='ses';render();clearInterval(TM);TM=setInterval(step,k=='R'?350:400);
}
function fin(){clearInterval(TM);if(S.chain&&S.k!='R'&&!S.nx){S.nx=1;setTimeout(autoNext,1100)}}
function autoNext(){if(!S||!S.done)return;G.wk.step++;if(G.wk.step<=3)startS(KIND[G.wk.step],true);else{V='hub';render()}}
function step(){S.k=='R'?raceStep():fpStep();if(S.done)fin();draw();ctl()}
function skip(){while(!S.done)S.k=='R'?raceStep():fpStep();fin();draw();ctl()}
function lapTry(id,pr){const d=G.drv[id],mine=d.t=='P';
 if(Math.random()>pr+(mine&&S.boost>0?.25:0))return;if(mine&&S.boost>0&&Math.random()<.12)return;
 const t=base(d)+rnd(0,1.8)-(mine&&S.boost>0?.5:0)-(S.tick%50)/50*.5;if(!(S.best[id]<t))S.best[id]=t}
const rk=l=>l.slice().sort((a,b)=>(S.best[a]??1e9)-(S.best[b]??1e9));
function fpStep(){
 S.tick++;if(S.boost>0)S.boost--;(S.k=='FP'?S.ids:S.act).forEach(i=>lapTry(i,S.k=='FP'?.22:.3));
 if(S.k=='Q'&&S.tick%50==0&&S.tick<150){const o=rk(S.act),keep=S.seg==0?16:8;S.elim[S.seg]=o.slice(keep);S.act=o.slice(0,keep);S.seg++;S.best={}}
 if(S.tick>=S.N){S.done=true;if(S.k=='Q')G.wk.grid=[...rk(S.act),...S.elim[1],...S.elim[0]]}
}
const rorder=()=>[...S.cars.filter(c=>!c.dnf).sort((a,b)=>a.t-b.t),...S.cars.filter(c=>c.dnf).sort((a,b)=>b.dl-a.dl)];
function pickTyre(c,rem,wx){if(wx=='wet')return'W';if(wx=='inter')return'I';
 let o=['S','M','H'].filter(x=>TY[x].l*.9>=rem);if(!o.length)o=['H'];
 if(new Set(c.used).size<2){const f=o.filter(x=>x!=c.tyre);if(f.length)o=f}return o[0]}
function raceStep(){
 const N=S.N,wx=G.wk.wx,lt0=C()[2];S.lap++;const prev=rorder().filter(c=>!c.dnf),rem=N-S.lap;
 let sc=S.sc>0;if(sc)S.sc--;else if(rem>4&&S.lap>2&&Math.random()<.008){S.sc=Math.floor(rnd(2,5));sc=true}
 S.scNow=sc;
 S.cars.forEach(c=>{c.jp=false;if(c.dnf)return;const d=G.drv[c.id],ty=eff(d,'tyr'),T=TY[c.tyre],f=c.w/T.l;
  let lt=sc?lt0*1.4:base(d)+T.p+f*.9+Math.max(0,f-.85)*10+MM[wx][c.tyre]+lt0*SL[wx]+rnd(0,1.9)+c.form;
  if(rem>3&&S.lap>1&&f>(sc?.5:.82+c.th+(ty-60)/400)){lt+=sc?10:22;c.jp=true;c.pits++;c.w=0;c.tyre=pickTyre(c,rem,wx);c.used.push(c.tyre)}
  else c.w+=(sc?.4:1)*(1.75-ty/100)*(d.t=='P'?1.2-G.pu.eff/500-G.car.care/500:1);
  c.t+=lt;if(Math.random()<(100-(d.t=='P'?G.pu.rel+G.car.rel:85))*.000058+.0004){c.dnf=true;c.dl=S.lap;if(!sc&&!S.sc&&rem>4&&Math.random()<.5)S.sc=Math.floor(rnd(3,5))}});
 if(sc){const o=S.cars.filter(c=>!c.dnf).sort((a,b)=>a.t-b.t);o.forEach((c,i)=>{if(i&&!c.jp)c.t=Math.min(c.t,o[0].t+i*.7)})}
 else for(let i=1;i<prev.length;i++){const c=prev[i],a=prev[i-1];if(c.dnf||a.dnf)continue;
  if(c.t-a.t<1.2)c.t-=clamp((eff(G.drv[c.id],'att')-eff(G.drv[a.id],'def'))*.015,-.6,.6)}
 if(S.lap>=N){S.done=true;finish()}
}
function finish(){
 const o=rorder(),res=[];let mine=0;
 o.forEach((c,p)=>{const d=G.drv[c.id],pt=c.dnf?0:(PTS[p]||0);if(pt){G.dp[c.id]=(G.dp[c.id]||0)+pt;G.tp[d.t]=(G.tp[d.t]||0)+pt}if(d.t=='P')mine+=pt;res.push({c,p,pt,d})});
 const prize=+(4+mine*.8+(mine?1:0)).toFixed(1);G.money+=prize;S.res=res;S.prize=prize;S.mine=mine;
}
function push(){if(S.push>0&&S.boost==0){S.push--;S.boost=8;ctl()}}
function ctl(){
 const e=$('#ctl');if(!e)return;let h;
 if(S.done)h=S.chain&&S.k!='R'?'<span class="m">Starting next session…</span>':`<button class="p" onclick="after()">Continue ${I.play}</button>`;
 else if(S.k=='R')h=`<div class="row"><span class="m">Tyres, pit stops and overtakes are handled automatically by drivers and engineers.</span><button onclick="skip()">${I.skip}Skip</button></div>`;
 else h=`<div class="row"><button class="${S.boost>0?'on':''}" ${S.push<1||S.boost?'disabled':''} onclick="push()">${I.zap}Push Lap (${S.push})</button><button onclick="skip()">${I.skip}Skip</button></div>`;
 e.innerHTML=h}
function draw(){
 if(!$('#tbl'))return;const k=S.k;let h='';
 if(k=='R'){const o=rorder();
  $('#stt').textContent=`${C()[0]} GP · Lap ${S.lap}/${S.N} · ${WX[G.wk.wx]}${S.scNow?' · SAFETY CAR':''}`;$('#stt').style.color=S.scNow?'#facc15':'';$('#tmr').textContent='';$('#pg').style.width=S.lap/S.N*100+'%';
  h='<table><tr><th>P</th><th>Driver</th><th>Gap</th><th>Tyre</th><th>Pits</th></tr>'+o.map((c,p)=>{const d=G.drv[c.id],T=TY[c.tyre];return `<tr class="${d.t=='P'?'me':''}"><td class="mono">${p+1}</td><td><span class="dot" style="background:${tc(d.t)}"></span>${sh(d)}</td><td class="mono">${c.dnf?'<span class="dn">DNF</span>':p?'+'+(c.t-o[0].t).toFixed(1):'LEAD'}</td><td class="mono">${c.dnf?'':`<span class="tb" style="color:${T.c};border-color:${T.c}">${c.tyre}</span>${Math.max(0,100-Math.round(c.w/T.l*100))}%`}</td><td class="mono">${c.pits}</td></tr>`}).join('')+'</table>';
 }else{
  const sec=k=='Q'?S.tick%50:S.tick,left=Math.max(0,20-sec*.4);
  $('#stt').textContent=k=='Q'?'Qualifying · Q'+(Math.min(S.seg,2)+1):'FP'+(G.wk.step+1);
  $('#tmr').textContent=S.done?'DONE':left.toFixed(1)+'s';$('#pg').style.width=(S.done?100:sec/50*100)+'%';
  const a=rk(S.act),all=k=='Q'?[...a,...S.elim[1],...S.elim[0]]:a,b0=S.best[a[0]];
  h='<table><tr><th>P</th><th>Driver</th><th>Time</th><th>Gap</th></tr>'+all.map((i,p)=>{const d=G.drv[i],out=k=='Q'&&p>=a.length,t=S.best[i];return `<tr class="${d.t=='P'?'me':''}" style="${out?'opacity:.45':''}"><td class="mono">${p+1}</td><td><span class="dot" style="background:${tc(d.t)}"></span>${sh(d)}</td><td class="mono">${t?ft(t):'--'}</td><td class="mono">${t&&p&&!out?'+'+(t-b0).toFixed(3):''}</td></tr>`}).join('')+'</table>';
 }
 $('#tbl').innerHTML=h}
function after(){if(S.k=='R'){V='res';save();render();return}G.wk.step++;V='hub';render()}
function resView(){
 $('#app').innerHTML=head()+`<div class="card"><h3>${C()[0]} GP – Results</h3><div class="wrap"><table>${S.res.map(r=>`<tr class="${r.d.t=='P'?'me':''}"><td class="mono">${r.c.dnf?'DNF':r.p+1}</td><td><span class="dot" style="background:${tc(r.d.t)}"></span>${r.d.n}</td><td class="m">${G.teams[r.d.t].n}</td><td class="mono">${r.c.used.map(u=>`<span class="tb" style="color:${TY[u].c};border-color:${TY[u].c}">${u}</span>`).join('')}</td><td class="mono up">${r.pt?'+'+r.pt:''}</td></tr>`).join('')}</table></div></div>
 <div class="card">Your team scored <b>${S.mine} pts</b> · prize & sponsors <b class="up">+$${S.prize}M</b><br><br><button class="p" onclick="nextRace()">${G.round>=23?'End Season':'Next Round'}</button></div>`}
function nextRace(){G.news=rdTick();Object.keys(G.teams).forEach(t=>{if(t!='P')G.teams[t].car=Math.min(97,G.teams[t].car+rnd(0,.3))});G.round++;wk();V=G.round>=24?'end':'hub';TAB='race';save();render()}
function endView(){
 const d=Object.keys(G.dp).map(Number).sort((a,b)=>G.dp[b]-G.dp[a]),t=Object.keys(G.teams).sort((a,b)=>(G.tp[b]||0)-(G.tp[a]||0));
 $('#app').innerHTML=head()+`<div class="card"><h3>Season ${G.season} complete</h3><h1>${G.drv[d[0]].n}</h1><p class="m">Drivers' champion · ${G.dp[d[0]]} pts</p><h2>${G.teams[t[0]].n}</h2><p class="m">Constructors' champion</p><p>Your team finished P${t.indexOf('P')+1} with ${G.tp.P||0} points.</p><button class="p" onclick="newSeason()">Season ${G.season+1} (reshuffle grid)</button></div>`}
function newSeason(){
 const all=Object.values(G.drv),pool=all.filter(d=>d.t!='P'),old={};
 all.forEach(d=>{const g=d.s=='F3'?[0,4]:d.s=='F2'?[-1,3]:[-3,2];['r','att','def','tyr','cor'].forEach(k=>d[k]=clamp(d[k]+Math.round(rnd(...g)+rnd(-1,1)),55,98))});
 pool.forEach(d=>old[d.id]=d.t);Object.values(G.eng).forEach(e=>['att','def','tyr'].forEach(k=>e[k]=clamp(e[k]+Math.round(rnd(-3,3)),50,98)));
 const ts=D.teams.map(t=>t[0]);ts.forEach(t=>G.teams[t].car=clamp(G.teams[t].car+Math.round(rnd(-6,1)),68,97));
 const sc=d=>d.r+rnd(-8,8)+(d.s=='F1'?4:0);pool.forEach(d=>d._s=sc(d));pool.sort((a,b)=>b._s-a._s);
 const slots=ts.flatMap(t=>[t,t]);for(let i=slots.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[slots[i],slots[j]]=[slots[j],slots[i]]}
 pool.forEach((d,k)=>{d.t=k<slots.length?slots[k]:'FA';delete d._s});
 G.news=pool.filter(d=>d.t!=old[d.id]).sort((a,b)=>b.r-a.r).slice(0,8).map(d=>`${d.n}: ${old[d.id]=='FA'?'Free agent':G.teams[old[d.id]].n} → ${d.t=='FA'?'Free agent':G.teams[d.t].n}`);
 G.season++;G.round=0;G.dp={};G.tp={};G.money+=20;wk();V='hub';TAB='race';save();render()}
fetch('data.json').then(r=>r.json()).then(d=>{D=d;
 const sv=localStorage.getItem(KEY);
 if(sv){G=JSON.parse(sv);if(!G.car){G.car={aero:G.chassis||62,spd:G.chassis||62,mech:G.chassis||62,care:60,rel:0};G.parts={};G.rd=[];G.wt=0}}else{const su=localStorage.getItem(SETUP);if(!su){location.href='index.html';return}build(JSON.parse(su))}
 document.documentElement.style.setProperty('--a',G.color);if(G.round>=24)V='end';render()
}).catch(()=>{$('#app').innerHTML='<div class="card"><h2>Could not load data.json</h2><p class="m">Serve this folder with a local web server (e.g. <span class="mono">python -m http.server</span>) instead of opening the file directly.</p></div>'});
</script></body></html>
