<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pit Wall – F1 Manager Sim</title>
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<link rel="stylesheet" href="ui.css">
<script src="ui.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0c0f;--s:#14161b;--s2:#1b1e25;--b:#262a33;--t:#e8eaf0;--m:#8a90a0;--a:#e10600;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px 'Space Grotesk',system-ui,sans-serif}
#app{max-width:1080px;margin:0 auto;padding:16px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px}
.card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:12px}
h1,h2,h3{margin:0 0 10px}h1{font-size:26px}h2{font-size:18px}h3{font-size:13px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}
.m{color:var(--m)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
button{font:inherit;color:var(--t);background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--m)}button.p{background:var(--a);border-color:var(--a);color:#fff;font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}button.on{border-color:var(--a);background:#2a1618}button.s{padding:5px 9px;font-size:12px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--b);white-space:nowrap}
th{color:var(--m);font-weight:500;font-size:12px}tr.me td{background:#ffffff0d}
.bar{height:4px;background:var(--s2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
.dot{display:inline-block;width:4px;height:14px;border-radius:2px;vertical-align:middle;margin-right:8px}
.steps{display:flex;gap:6px;margin:10px 0}.st{flex:1;text-align:center;padding:8px 2px;border-radius:8px;background:var(--s2);color:var(--m);font-size:12px}
.st.d{color:#4ade80}.st.c{background:var(--a);color:#fff;font-weight:700}
.wrap{overflow-x:auto}.up{color:#4ade80}.dn{color:#f87171}
.stt{display:inline-flex;gap:8px;color:var(--m)}.stt b{color:var(--t);font-weight:600}
.tb{display:inline-block;width:20px;height:20px;line-height:17px;text-align:center;border:2px solid;border-radius:50%;font:700 11px 'JetBrains Mono',monospace;margin-right:6px}
.mod{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}.mod .card{max-width:380px;width:100%}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:9;pointer-events:none}#toast div{background:#fff;color:#000;padding:9px 14px;border-radius:10px}.rad{max-height:150px;overflow-y:auto;font-size:13px}.rad div{padding:3px 0;border-bottom:1px solid var(--b)}.fl{color:#a855f7}

@keyframes up{from{opacity:0;transform:translateY(10px)}}@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes slide{from{transform:translateX(-100%)}}@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(2.2);opacity:0}}
@keyframes glow{50%{box-shadow:0 0 14px var(--a)}}@keyframes inL{from{opacity:0;transform:translateX(-22px)}}@keyframes inR{from{opacity:0;transform:translateX(22px)}}
.card{animation:up .4s ease both}.card tr{animation:fade .35s both}#tbl tr{animation:none}
button{transition:transform .15s,border-color .15s,background .15s}button:hover:not(:disabled){transform:translateY(-1px)}button:active:not(:disabled){transform:scale(.97)}
tr:hover td{background:#ffffff08}.bar i{transition:width .4s linear}
.mod{animation:fade .2s}.mod .card{animation:pop .25s ease both}.mod .drw{animation:slide .25s ease both}
#toast div{animation:up .3s ease both}.st.c{animation:glow 1.8s ease-in-out infinite}
.map{position:relative;width:100%;aspect-ratio:2/1;border-radius:10px;overflow:hidden;background:#0f1a24}
.map img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .8s}.map img.ok{opacity:.85}
.map::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff14 1px,transparent 1px),linear-gradient(90deg,#ffffff14 1px,transparent 1px);background-size:100% 16.666%,8.333% 100%}
.mk{position:absolute;z-index:2;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);padding:0;border:2px solid #0b0c0f;background:#fff;transition:transform .2s,box-shadow .2s}
.mk:hover:not(:disabled),.mk.sel{transform:translate(-50%,-50%) scale(1.7)}.mk.sel{box-shadow:0 0 0 3px #fff6}
.mk.done{background:#4ade80}.mk.cur{width:14px;height:14px;background:var(--a)}.mk.cur::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--a);animation:ring 1.6s ease-out infinite}
.tip{position:absolute;z-index:3;transform:translate(-50%,-160%);background:#fff;color:#000;padding:4px 9px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;animation:pop .25s ease both}
.rc{background:#15171c;border-radius:14px;padding:18px 18px 12px;margin-bottom:14px;overflow:hidden}
.rh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:8px}
.rn{font:800 clamp(44px,12vw,84px)/1 'Space Grotesk',sans-serif;color:var(--tc)}
.rt{text-align:right;font:800 clamp(24px,6.5vw,46px)/1 'Space Grotesk',sans-serif;text-transform:uppercase;color:var(--tc)}.rt span{display:block;color:#fff;margin-top:4px}
.q{font:600 clamp(17px,3.8vw,27px)/1.2 'Space Grotesk',sans-serif;text-transform:uppercase;margin:16px 0;max-width:90%;animation-fill-mode:both}
.q.re{color:#fff;animation-name:inL;animation-duration:.5s}.q.dr{color:var(--tc);text-align:right;margin-left:auto;animation-name:inR;animation-duration:.5s}
.rf{font-size:11px;color:#fff;opacity:.6;text-align:center;margin-top:6px}
.split{display:grid;grid-template-columns:1fr 320px;gap:12px;align-items:start}@media(max-width:820px){.split{grid-template-columns:1fr}}
.side .rc{padding:12px 12px 8px;margin-bottom:10px}.side .rn{font-size:40px}.side .rt{font-size:22px}.side .q{font-size:13.5px;margin:10px 0;max-width:96%}
.dl{margin-left:8px;color:var(--t);opacity:.85}.dl.m{color:var(--m)}
select{font:inherit;color:var(--t);background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:8px 10px;max-width:100%}
html{-webkit-text-size-adjust:100%}button,select{touch-action:manipulation}.stt{flex-wrap:wrap}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--s)}
.map{background:radial-gradient(ellipse at 50% 40%,#16283a,#0b1118)}
@media(max-width:600px){#app{padding:10px}.card{padding:12px}h1{font-size:22px}button{padding:10px 12px;min-height:40px}button.s{min-height:34px;padding:6px 10px}td,th{padding:7px 5px}table{font-size:13px}.hm{display:none}.steps{gap:3px}.st{font-size:10px;padding:7px 1px}.stt{gap:6px}#tbl{max-height:70vh!important}.mod .card{max-height:88vh;overflow:auto}.mk{width:12px;height:12px}.row{gap:8px}.rt{font-size:26px}.rn{font-size:44px}.drw{width:min(260px,80vw)!important}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const SK=n=>'pitwall_save_'+n,SETUP='pitwall_setup',PTS=[25,18,15,12,10,8,6,4,2,1],SPTS=[8,7,6,5,4,3,2,1],SPRINT=[1,5,6,10,13,17];
let SLOT=+localStorage.getItem('pitwall_slot')||1,SM=false,DLG={},NP=null,PR=null,MENU=false,CV=0,RC=[],CT={};
const TY={S:{l:20,p:-.55,c:'#ef4444'},M:{l:30,p:-.2,c:'#facc15'},H:{l:42,p:0,c:'#e5e7eb'},I:{l:30,p:0,c:'#22c55e'},W:{l:26,p:0,c:'#3b82f6'}};
const MM={dry:{S:0,M:0,H:0,I:4,W:6},inter:{S:7,M:7,H:7,I:0,W:1.5},wet:{S:10,M:10,H:10,I:2.5,W:0}},SL={dry:0,inter:.06,wet:.1},WX={dry:'Dry',inter:'Intermediate',wet:'Wet'};
const ic=(p)=>`<svg class="i" viewBox="0 0 24 24"><path d="${p}"/></svg>`;
const I={play:'<i class="fi fi-rr-play"></i>',skip:'<i class="fi fi-rr-forward"></i>',zap:'<i class="fi fi-rr-bolt"></i>'},ICN={race:'flag',std:'trophy',mkt:'users',eng:'headset',car:'settings',acad:'graduation-cap',cr:'chart-histogram'};
const DF=[.5,.6,.7,.4,.3,.4,.4,1,.7,.4,.6,.4,.9,.8,0,.6,.3,.95,.5,.6,.6,.1,.7,.5],KIND=['FP','FP','FP','Q','R'];
const PARTS=[{id:'fw',n:'Front Wing',e:{aero:2.5}},{id:'rw',n:'Rear Wing',e:{aero:1.5,spd:1}},{id:'fl',n:'Floor',e:{aero:3}},{id:'sp',n:'Sidepods & Cooling',e:{spd:1.5,rel:1}},{id:'su',n:'Suspension',e:{mech:2.5,care:1.5}},{id:'br',n:'Brakes',e:{mech:1.5,rel:1}},{id:'gb',n:'Gearbox',e:{spd:1.5,rel:1.5}},{id:'wr',n:'Weight Reduction',e:{mech:1.2,spd:1.2}}];
const SN={aero:'Downforce',spd:'Top speed',mech:'Mechanical',care:'Tyre care',rel:'Reliability'};
let D,G,V='hub',TAB='race',S=null,TM=null,TR=null;
const lerp=(v,[a,b],[c,d])=>Math.round(c+(clamp(v,a,b)-a)/(b-a)*(d-c));
const dcost=d=>lerp(d.r,D.meta[d.s].ovr,D.meta[d.s].cost),price=d=>Math.round(dcost(d)*1.5);
const ecost=e=>Math.round(lerp((e.att+e.def+e.tyr)/3,D.meta.eng.avg,D.meta.eng.cost)*1.5);
const save=()=>localStorage.setItem(SK(SLOT),JSON.stringify(G));
const toast=m=>{const t=$('#toast'),e=document.createElement('div');e.textContent=m;t.appendChild(e);setTimeout(()=>e.remove(),2800)};
const note=m=>toast(m);
function spend(c){if(c>G.money){toast('Not enough budget');return false}if(G.spent+c>G.cap){toast('Cost cap exceeded for this season');return false}G.money-=c;G.spent+=c;return true}
const pucost=p=>Math.round(lerp((p[2]+p[3]+p[4])/3,D.meta.pu.avg,D.meta.pu.cost)*1.5);
const C=()=>D.circuits[Math.min(G.round,23)],tc=t=>G.teams[t].c,sh=d=>d.n.replace(/^(\S)\S*\s/,'$1. ');
const myIds=()=>Object.values(G.drv).filter(d=>d.t=='P').map(d=>d.id);
const engOf=d=>d.t=='P'?Object.values(G.eng).find(e=>e.own&&e.dv==d.id):null;
const pen=d=>d.t=='P'&&d.ad!=null&&d.ad<1?(1-d.ad)*12:0;
const eff=(d,k)=>{if(d.t!='P')return d[k];const e=engOf(d);return (d[k]-pen(d))*.65+(e?e[k]:55)*.35};
const chassis=()=>{const c=G.car,df=DF[Math.min(G.round,23)];return (c.aero*df+c.spd*(1-df))*.65+c.mech*.35};
const carEff=d=>d.t=='P'?chassis()*.6+G.pu.pw*.4:G.teams[d.t].car;
const base=d=>C()[2]-(carEff(d)*.6+(d.r-pen(d))*.4-80)*.12-(d.cor-pen(d)-75)*.012;
const ft=s=>Math.floor(s/60)+':'+(s%60).toFixed(3).padStart(6,'0');
const stats=d=>`<span class="mono stt">ATT <b>${d.att}</b> DEF <b>${d.def}</b> TYR <b>${d.tyr}</b> COR <b>${d.cor}</b></span>`;
const estats=e=>`<span class="mono stt">ATT <b>${e.att}</b> DEF <b>${e.def}</b> TYR <b>${e.tyr}</b></span>`;
function build(su){
 G={season:2026,round:0,money:40,news:[],dp:{},tp:{},teams:{},drv:{},eng:{},wk:null,name:su.name,color:su.color,country:su.country,car:{aero:62,spd:62,mech:62,care:60,rel:0},parts:{},rd:[],wt:0,pu:{n:D.pu[su.pu][1],pw:D.pu[su.pu][2],rel:D.pu[su.pu][3],eff:D.pu[su.pu][4]}};
 D.teams.forEach(t=>G.teams[t[0]]={n:t[1],c:t[2],car:t[3]});G.teams.P={n:su.name,c:su.color};
 D.drivers.forEach((d,i)=>G.drv[i]={id:i,n:d[0],s:d[1],r:d[2],att:d[3],def:d[4],tyr:d[5],cor:d[6],t:d[7]||'FA'});
 su.drv.forEach(i=>{G.drv[i].t='P';G.drv[i].ad=0});
 D.engineers.forEach((e,i)=>G.eng[i]={id:i,n:e[0],att:e[1],def:e[2],tyr:e[3],own:false,dv:null});
 for(const k in su.eng)if(su.eng[k]!=null){G.eng[su.eng[k]].own=true;G.eng[su.eng[k]].dv=+k}
 fill();wk();mig();G.puIdx=su.pu;save();
}
function fill(){D.teams.forEach(t=>{let n=Object.values(G.drv).filter(d=>d.t==t[0]).length;while(n++<2){const p=Object.values(G.drv).filter(d=>d.t=='FA').sort((a,b)=>b.r-a.r).slice(0,8);p[Math.floor(Math.random()*p.length)].t=t[0]}})}
function wk(){const w=Math.random(),sp=SPRINT.includes(G.round);G.wk={step:0,grid:null,sgrid:null,wx:w<.08?'wet':w<.2?'inter':'dry',kinds:sp?['FP','SQ','SPR','Q','R']:['FP','FP','FP','Q','R'],labels:sp?['FP1','Sprint Quali','Sprint','Quali','Race']:['FP1','FP2','FP3','Quali','Race']}}
function mig(){if(!G.car){G.car={aero:G.chassis||62,spd:G.chassis||62,mech:G.chassis||62,care:60,rel:0};G.parts={};G.rd=[];G.wt=0}
 G.country=G.country||'United Kingdom';G.career=G.career||{td:0,tc:0,w:0,p:0,pl:0,fl:0,best:0};G.hist=G.hist||[];G.spent=G.spent||0;G.cap=G.cap||120;G.regYear=G.regYear||2030;G.sw=G.sw||0;
 if(G.puIdx==null)G.puIdx=Math.max(0,D.pu.findIndex(p=>p[1]==G.pu.n));
 if(G.wk&&!G.wk.kinds){G.wk.kinds=['FP','FP','FP','Q','R'];G.wk.labels=['FP1','FP2','FP3','Quali','Race']}}
function head(){return `<div class="row card top" style="padding:12px"><b style="color:var(--a)">${G.name}</b><span class="m">${G.country||''} · S${G.season}</span><span class="sp"></span><span class="mono"><i class="fi fi-rr-wallet"></i> $${G.money.toFixed(1)}M · cap ${G.spent.toFixed(0)}/${G.cap}</span></div>`}
function render(){
 if(V=='hub')hub();else if(V=='res')resView();else if(V=='end')endView();
 else{$('#app').innerHTML=`${head()}<div class="split"><div><div class="card"><div class="row"><h2 id="stt" class="sp"></h2><span id="tmr" class="mono"></span></div><div class="bar"><i id="pg" style="width:0"></i></div><div id="ctl" style="margin-top:12px"></div></div><div class="card wrap" style="max-height:560px;overflow-y:auto" id="tbl"></div></div><div id="side" class="side"></div></div>`;ctl();draw()}
}
function hub(){
 save();const w=G.wk,c=C(),tabs=[['race','Race'],['std','Standings'],['mkt','Drivers'],['eng','Engineers'],['car','Car & PU'],['acad','Academy'],['cr','Career']];
 let h=head()+`<div class="row hdesk" style="margin-bottom:12px"><button onclick="MENU=true;hub()" aria-label="Menu"><i class="fi fi-rr-menu-burger"></i></button><h2 style="margin:0">${tabs.find(t=>t[0]==TAB)[1]}</h2></div>${MENU?`<div class="mod" style="justify-content:flex-start;align-items:stretch;padding:0" onclick="MENU=false;hub()"><div class="card drw" style="width:240px;margin:0;border-radius:0;display:flex;flex-direction:column;gap:6px" onclick="event.stopPropagation()"><h3>Menu</h3>${tabs.map(t=>`<button class="${TAB==t[0]?'on':''}" onclick="TAB='${t[0]}';MENU=false;hub()"><i class="fi fi-rr-${ICN[t[0]]}"></i>${t[1]}</button>`).join('')}<button onclick="MENU=false;SM=true;hub()"><i class="fi fi-rr-database"></i>Saves</button></div></div>`:''}`;
 if(TAB=='race'){
  h+=`<div class="card"><h3>Round ${G.round+1} / 24${SPRINT.includes(G.round)?' · SPRINT WEEKEND':''}</h3><h1>${c[0]} GP</h1><div class="m">${c[1]} laps · ref. lap ${ft(c[2])} · Weather: <b style="color:var(--t)">${WX[w.wx]}</b></div>
  <div class="steps">${w.labels.map((s,i)=>`<div class="st ${i<w.step?'d':i==w.step?'c':''}">${s}</div>`).join('')}</div>
  ${fpSel()}<div class="row"><button class="p" onclick="startS('${w.kinds[w.step]}')">${I.play} Start ${w.labels[w.step]}</button>${['FP','Q','SQ'].includes(w.kinds[w.step])?`<button onclick="startS('${w.kinds[w.step]}',true)">${I.zap} Auto-run</button>`:''}</div></div>
  <div class="card"><h3>${G.season} calendar</h3>${mapHTML()}<div id="ginfo" class="m" style="margin-top:8px"></div></div>
  <div class="card wrap" style="max-height:340px;overflow-y:auto"><h3>All circuits</h3><table><tr><th>#</th><th>Grand Prix</th><th>Circuit</th><th>Laps</th><th></th></tr>${D.circuits.map((x,i)=>`<tr onclick="gfocus(${i})" style="cursor:pointer;${i==G.round?'background:#ffffff0d':''}"><td class="mono">${i+1}</td><td>${x[0]}${SPRINT.includes(i)?' <span class="mono" style="color:#facc15">SPRINT</span>':''}</td><td class="m">${x[5]}</td><td class="mono">${x[1]}</td><td class="mono ${i<G.round?'up':''}">${i<G.round?'Done':i==G.round?'Next':''}</td></tr>`).join('')}</table></div>
  <div class="card"><h3>Your drivers</h3>${myIds().map(i=>{const d=G.drv[i],e=engOf(d);return `<div style="margin-bottom:10px"><div class="row"><span class="dot" style="background:${G.color}"></span><b>${d.n}</b><span class="sp"></span><span class="mono">OVR ${d.r} · ${G.dp[i]||0} pts</span></div>${stats(d)}${d.ad!=null&&d.ad<1?`<div class="row" style="margin:4px 0"><span class="m">Adaptation</span><div class="bar sp"><i style="width:${Math.round(d.ad*100)}%"></i></div><span class="mono">${Math.round(d.ad*100)}%</span></div>`:''}<div class="m">Engineer: ${e?e.n:'none (hire one in Engineers)'}</div></div>`}).join('')}</div>`;
  if(G.news.length)h+=`<div class="card"><h3>News</h3>${G.news.map(n=>`<div class="m">${n}</div>`).join('')}</div>`;
 }
 if(TAB=='std'){
  const ds=Object.keys(G.dp).map(Number).sort((a,b)=>G.dp[b]-G.dp[a]),ts=Object.keys(G.teams).sort((a,b)=>(G.tp[b]||0)-(G.tp[a]||0));
  h+=`<div class="card"><h3>Drivers</h3><table>${ds.length?ds.map((i,k)=>`<tr class="${G.drv[i].t=='P'?'me':''}"><td class="mono">${k+1}</td><td><span class="dot" style="background:${tc(G.drv[i].t)}"></span>${G.drv[i].n}</td><td class="mono">${G.dp[i]}</td></tr>`).join(''):'<tr><td class="m">No points yet</td></tr>'}</table></div>
  <div class="card"><h3>Constructors</h3><table>${ts.map((t,k)=>`<tr class="${t=='P'?'me':''}"><td class="mono">${k+1}</td><td><span class="dot" style="background:${tc(t)}"></span>${G.teams[t].n}</td><td class="mono">${G.tp[t]||0}</td></tr>`).join('')}</table></div>`;
 }
 if(TAB=='mkt'){
